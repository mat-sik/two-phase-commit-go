syntax = "proto3";

package transfer.v1;

option go_package = "github.com/mat-sik/two-phase-commit-go/examples/internal/generated/transfer/v1";

service TransferService {
  rpc PrepareTransaction (PrepareTransactionRequest) returns (PrepareTransactionResponse);
  rpc CommitTransaction (CommitTransactionRequest) returns (CommitTransactionResponse);
  rpc RollbackTransaction (RollbackTransactionRequest) returns (RollbackTransactionResponse);
}

message PrepareTransactionRequest {
  string transaction_id = 1;
  TransferPayload payload = 2;
}

message TransferPayload {
  string sender_id = 1;
  string receiver_id = 2;
  double amount = 3;
}

message PrepareTransactionResponse {
}

message CommitTransactionRequest {
  string transaction_id = 1;
}

message CommitTransactionResponse {
}

message RollbackTransactionRequest {
  string transaction_id = 1;
}

message RollbackTransactionResponse {
}